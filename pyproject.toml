[project]
name = "fastidempotent"
version = "0.1.0"
description = "Idempotency support for FastAPI — pluggable backends for memory, Redis, PostgreSQL, MySQL, and SQLite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Swayam Patil" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
keywords = ["fastapi", "idempotency", "idempotent", "redis", "sqlalchemy"]

dependencies = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
sqlite = ["sqlalchemy>=2.0.0", "aiosqlite>=0.17.0"]
postgres = ["sqlalchemy>=2.0.0", "asyncpg>=0.27.0"]
mysql = ["sqlalchemy>=2.0.0", "asyncmy>=0.2.0"]
sql = ["sqlalchemy>=2.0.0"]
all = [
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.17.0",
    "asyncpg>=0.27.0",
    "asyncmy>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Swish78/fastidempotent"
Repository = "https://github.com/Swish78/fastidempotent"
Documentation = "https://github.com/Swish78/fastidempotent#readme"
Issues = "https://github.com/Swish78/fastidempotent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastidempotent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.11",
    "asyncpg>=0.31.0",
    "fakeredis>=2.37.0",
    "hatchling>=1.31.0",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.1",
    "ruff>=0.16.0",
    "sqlalchemy>=2.0.51",
]
